# Manual, read-only test: how much insider-trading data is available for our
# US and Canadian stocks? Never trades and never saves anything.
name: Insider data check (no trading)

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  PYTHONWARNINGS: "ignore"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Read insider data for every stock (no trading)
        run: python -m sim.insider_probe
