# Manual check that the data source works. Fetches live data and prints this
# week's ranking, but never trades and never saves anything.
name: Data check (no trading)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Fetch live data and rank (no trading)
        run: python -m sim.dry_run
